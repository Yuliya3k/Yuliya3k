name: Metrics

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/metrics.yml]

permissions:
  contents: write

concurrency:
  group: metrics
  cancel-in-progress: true

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # METRICS_TOKEN: classic token with repo + read:user, so private
      # repositories count. Private repository names are never shown:
      # the lines plugin shows totals only (its history chart was dropped:
      # whole-project imports of 8-12 million lines flattened it).
      # Habits, recent languages and activity are left out: they read the
      # events feed, which is empty for this account.
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          committer_branch: main
          config_timezone: Europe/Madrid
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner, collaborator
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_languages_details: percentage
          plugin_languages_limit: 8
          plugin_lines: yes
          plugin_lines_sections: base
          plugin_lines_delay: 10
